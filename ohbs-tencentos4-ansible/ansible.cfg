[defaults]
inventory               = inventory/hosts.ini
roles_path              = roles
host_key_checking       = True
retry_files_enabled     = False
stdout_callback         = default
display_skipped_hosts   = False
forks                   = 20
timeout                 = 30
gathering               = smart
fact_caching            = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout    = 3600
interpreter_python      = auto
nocows                  = 1

[ssh_connection]
pipelining  = True
ssh_args    = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
scp_if_ssh  = smart

# ── Privilege escalation ───────────────────────────────────────────
# Three execution modes are supported:
#
#   A. Direct root         ansible_user=root
#      No extra flags needed. Full scan + apply coverage.
#
#   B. sudo (become)       ansible-playbook scan.yml --become
#      Ansible escalates via sudo. Set ansible_become_user and
#      ansible_become_method in inventory if your environment
#      uses a role account or a method other than sudo.
#
#   C. Unprivileged        ansible-playbook scan.yml
#      No root at all. Scan runs but some checks may be skipped
#      (file permissions, kernel parameters, etc.). Apply mode
#      will refuse to continue without privileges.
#
# become=False is the safe default: nothing escalates unless you
# explicitly add --become / -b on the CLI or set become:true in
# your inventory / playbook.
[privilege_escalation]
become        = False
become_method = sudo
become_user   = root
