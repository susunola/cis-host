---
# Read-only CIS Windows Server assessment
#   ansible-playbook -i inventory/hosts.ini scan.yml
- name: "CIS Windows Server Benchmark - scan ({{ cis_profile | default('L1') }})"
  hosts: "{{ cis_hosts | default('win2025') }}"
  gather_facts: true
  serial: "{{ cis_serial | default('100%') }}"

  roles:
    - role: cis_win2025
      vars:
        cis_mode: scan
