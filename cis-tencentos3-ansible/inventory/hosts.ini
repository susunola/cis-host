# ---------------------------------------------------------------------------
# Inventory for the CIS TencentOS Linux 3 Benchmark playbooks.
# Replace the samples below with your own hosts.
# ---------------------------------------------------------------------------

[tencentos3]
# tos3-web-01  ansible_host=10.0.1.11
# tos3-web-02  ansible_host=10.0.1.12
# tos3-db-01   ansible_host=10.0.2.21  cis_profile=L2

[tencentos3:vars]
ansible_user = root
; ansible_ssh_private_key_file = ~/.ssh/id_ed25519
; ansible_become_password      = "{{ vault_sudo_password }}"

# --- Optional per-group tuning ---------------------------------------------
# Hosts that must never receive disruptive remediations:
# [tencentos3_frozen]
# tos3-db-01
# [tencentos3_frozen:vars]
# cis_allow_disruptive = false
# cis_exclude = ["1.1.2", "3.4"]
