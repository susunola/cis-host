---
# Minimal Molecule scenario for TencentOS 3.
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: tencentos3
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    pre_build_image: true
provisioner:
  name: ansible
  env:
    # Allow the converge play to locate the role by its short name.
    ANSIBLE_ROLES_PATH: "${ANSIBLE_ROLES_PATH}:../../../../"
verifier:
  name: ansible
