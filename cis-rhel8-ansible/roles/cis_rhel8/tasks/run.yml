---
- name: Determine effective mode
  ansible.builtin.set_fact:
    cis_mode_effective: "{{ 'scan' if ansible_check_mode and cis_mode == 'apply' else cis_mode }}"

- name: Create working directory
  ansible.builtin.tempfile:
    state: directory
    path: "{{ cis_remote_tmp }}"
    prefix: "cis-{{ cis_os_key }}-"
    suffix: ""
  register: _cis_tmp
  check_mode: false
  changed_when: false

- name: Verify engine artifacts exist
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ item }}"
  loop:
    - "{{ cis_engine_file }}"
    - "{{ cis_rules_file }}"
  register: _artifact_stat
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false

- name: Fail if any engine artifact is missing
  ansible.builtin.fail:
    msg: "Missing CIS artifact: {{ item.item }}"
  loop: "{{ _artifact_stat.results }}"
  when: not item.stat.exists
  changed_when: false

- name: Validate rules JSON is parseable
  ansible.builtin.set_fact:
    _rules_json_valid: "{{ lookup('file', role_path ~ '/files/' ~ cis_rules_file) | from_json | length }}"
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false

- name: Ship engine and rules
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ _cis_tmp.path }}/{{ item }}"
    mode: "0700"
  loop:
    - "{{ cis_engine_file }}"
    - "{{ cis_rules_file }}"
  check_mode: false
  changed_when: false

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ cis_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  check_mode: false
  when: cis_mode_effective == 'apply'

- name: Assemble engine command
  ansible.builtin.set_fact:
    cis_engine_argv: >-
      {{ [cis_python_real,
          _cis_tmp.path ~ '/' ~ cis_engine_file,
          '--catalog', _cis_tmp.path ~ '/' ~ cis_rules_file,
          '--mode', cis_mode_effective,
          '--profile', cis_profile,
          '--platform', cis_platform,
          '--benchmark', cis_benchmark_name ~ ' ' ~ cis_benchmark_version,
          '--out', _cis_tmp.path ~ '/result.json']
         + (['--include', cis_include | join(',')]
            if (cis_include | length) > 0 else [])
         + (['--exclude', cis_exclude | join(',')]
            if (cis_exclude | length) > 0 else [])
         + (['--sections', cis_sections | join(',')]
            if (cis_sections | length) > 0 else [])
         + (['--families', cis_families | join(',')]
            if (cis_families | length) > 0 else [])
         + (['--backup-dir', cis_backup_dir]
            if (cis_mode_effective == 'apply') else [])
         + (['--allow-disruptive']
            if (cis_mode_effective == 'apply' and cis_allow_disruptive | bool)
            else []) }}

- name: Run benchmark
  ansible.builtin.command:
    argv: "{{ cis_engine_argv }}"
  check_mode: false
  changed_when: cis_mode_effective == 'apply'
  register: _cis_run
  timeout: "{{ cis_engine_timeout | int }}"
  environment:
    LC_ALL: C
    LANG: C

- name: Slurp result
  check_mode: false
  ansible.builtin.slurp:
    src: "{{ _cis_tmp.path }}/result.json"
  register: _cis_result_raw

- name: Parse result
  ansible.builtin.set_fact:
    cis_result: "{{ _cis_result_raw.content | b64decode | from_json }}"

- name: Clean up temp directory
  check_mode: false
  changed_when: false
  ansible.builtin.file:
    path: "{{ _cis_tmp.path }}"
    state: absent
  when: not (cis_keep_remote_artifacts | default(false))

- name: Remediation summary
  ansible.builtin.debug:
    msg:
      - "CIS scan complete: {{ cis_result.summary.all.total }} rules"
      - "Pass: {{ cis_result.summary.all.pass }} / Fail: {{ cis_result.summary.all.fail }}"
      - "Score: {{ cis_result.summary.all.score }}%"
  when: cis_result.summary.all.assessed | default(0) > 0
