[defaults]
inventory              = inventory/hosts.ini
roles_path             = roles
host_key_checking      = False
retry_files_enabled    = False
stdout_callback        = default
display_skipped_hosts  = False
forks                  = 20
timeout                = 30
gathering              = smart
fact_caching            = jsonfile
fact_caching_connection = .facts_cache
fact_caching_timeout    = 3600

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey,password
scp_if_ssh = smart

# ── Privilege escalation ───────────────────────────────────────────
# Three execution modes are supported:
#
#   A. Built-in SYSTEM    ansible_user=Administrator
#      WinRM typically runs as SYSTEM. Full scan + apply coverage.
#
#   B. become             ansible-playbook scan.yml --become
#      Ansible escalates via runas. Set ansible_become_user,
#      ansible_become_method, and ansible_become_password in
#      inventory if your environment requires explicit credentials.
#
#   C. Unprivileged       ansible-playbook scan.yml
#      No escalation. Scan runs but restricted. Some registry
#      reads, policy queries, and file permission checks may
#      be skipped. Apply mode will refuse to continue without
#      privileges.
#
# become=False is the safe default: nothing escalates unless you
# explicitly add --become / -b on the CLI or set become:true in
# your inventory / playbook.
[privilege_escalation]
become        = False
become_method = runas
become_user   = SYSTEM
