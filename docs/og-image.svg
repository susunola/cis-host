<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="63" x2="1200" y2="63" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="126" x2="1200" y2="126" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="189" x2="1200" y2="189" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="252" x2="1200" y2="252" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="378" x2="1200" y2="378" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="441" x2="1200" y2="441" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="504" x2="1200" y2="504" stroke="#58a6ff" stroke-width="1"/>
    <line x1="0" y1="567" x2="1200" y2="567" stroke="#58a6ff" stroke-width="1"/>
  </g>

  <!-- Decorative top accent bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Shield icon -->
  <g transform="translate(120, 210)" filter="url(#glow)">
    <path d="M80 0 L160 0 L160 80 Q160 160 80 200 Q0 160 0 80 L0 0 Z"
          fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.8"/>
    <path d="M80 40 L110 60 L110 100 Q110 140 80 160 Q50 140 50 100 L50 60 Z"
          fill="url(#shield)" opacity="0.15" stroke="url(#shield)" stroke-width="1.5"/>
    <!-- Check mark -->
    <path d="M65 100 L78 115 L98 85" fill="none" stroke="#3fb950" stroke-width="4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="330" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800"
        fill="#e6edf3" letter-spacing="-1">
    SecX Automation Suite
  </text>

  <!-- Tagline -->
  <text x="330" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="400"
        fill="#8b949e">
    Compliance Baseline as Code
  </text>

  <!-- Sub-tagline -->
  <text x="330" y="360" font-family="monospace" font-size="20" fill="#3fb950">
    Hardening &amp; Drift Automation
  </text>

  <!-- Divider -->
  <line x1="330" y1="395" x2="900" y2="395" stroke="#30363d" stroke-width="1"/>

  <!-- Feature pills -->
  <g transform="translate(330, 430)">
    <rect x="0" y="0" width="140" height="32" rx="16" fill="#1f6feb" opacity="0.15"/>
    <text x="70" y="22" font-family="system-ui, sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle">14 OS targets</text>

    <rect x="155" y="0" width="120" height="32" rx="16" fill="#1f6feb" opacity="0.15"/>
    <text x="215" y="22" font-family="system-ui, sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle">scan / apply</text>

    <rect x="290" y="0" width="115" height="32" rx="16" fill="#238636" opacity="0.15"/>
    <text x="347" y="22" font-family="system-ui, sans-serif" font-size="14" fill="#3fb950" text-anchor="middle">HTML reports</text>

    <rect x="420" y="0" width="155" height="32" rx="16" fill="#1f6feb" opacity="0.15"/>
    <text x="497" y="22" font-family="system-ui, sans-serif" font-size="14" fill="#58a6ff" text-anchor="middle">audit-log ready</text>
  </g>

  <!-- Bottom bar -->
  <rect x="330" y="505" width="700" height="20" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="680" y="519" font-family="monospace" font-size="12" fill="#484f58" text-anchor="middle">github.com/susunola/cis-host</text>
</svg>