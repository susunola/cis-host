<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="system-ui, -apple-system, sans-serif">
  <!-- Three-column layout: Controller | Target | Reports -->

  <!-- Column backgrounds -->
  <rect x="10" y="48" width="300" height="520" rx="4" fill="#f0f4ff" stroke="#b0c4de" stroke-width="1"/>
  <rect x="330" y="48" width="300" height="520" rx="4" fill="#f0fff0" stroke="#b0d4b0" stroke-width="1"/>
  <rect x="650" y="48" width="300" height="520" rx="4" fill="#faf5ff" stroke="#c4b0d4" stroke-width="1"/>

  <!-- Column headers -->
  <text x="160" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">Controller Host</text>
  <text x="160" y="94" text-anchor="middle" font-size="10" fill="#666">Ansible control node</text>
  <text x="480" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">Target Host(s)</text>
  <text x="480" y="94" text-anchor="middle" font-size="10" fill="#666">Remote machine(s)</text>
  <text x="800" y="76" text-anchor="middle" font-size="14" font-weight="700" fill="#2c3e50">Local Disk</text>
  <text x="800" y="94" text-anchor="middle" font-size="10" fill="#666">Report output</text>

  <!-- ===== Step 1: preflight ===== -->
  <rect x="30" y="114" width="260" height="54" rx="2" fill="#fff" stroke="#b0c4de" stroke-width="1"/>
  <rect x="30" y="114" width="28" height="54" rx="2" fill="#4a90d9"/>
  <text x="44" y="130" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">1</text>
  <text x="68" y="130" font-size="11" font-weight="700" fill="#2c3e50">preflight</text>
  <text x="68" y="148" font-size="9" fill="#666">validate vars, probe python, confirm root</text>
  <text x="68" y="162" font-size="9" fill="#999">local</text>

  <!-- Arrow 1→2 -->
  <line x1="160" y1="168" x2="160" y2="186" stroke="#999" stroke-width="1"/>

  <!-- ===== Step 2: push engine files ===== -->
  <rect x="30" y="188" width="260" height="54" rx="2" fill="#fff" stroke="#b0c4de" stroke-width="1"/>
  <rect x="30" y="188" width="28" height="54" rx="2" fill="#4a90d9"/>
  <text x="44" y="204" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">2</text>
  <text x="68" y="204" font-size="11" font-weight="700" fill="#2c3e50">push engine files</text>
  <text x="68" y="222" font-size="9" fill="#666">copy engine script, rules, guides</text>
  <text x="68" y="236" font-size="9" fill="#999">scp / ansible copy</text>

  <!-- Arrow 2 → Target (rightward) -->
  <line x1="290" y1="215" x2="344" y2="215" stroke="#999" stroke-width="1.5"/>

  <!-- ===== Target: received files box ===== -->
  <rect x="350" y="140" width="260" height="120" rx="2" fill="#fff" stroke="#b0d4b0" stroke-width="1"/>
  <text x="480" y="158" text-anchor="middle" font-size="11" font-weight="700" fill="#2c3e50">/tmp/cis-scan/</text>
  <line x1="365" y1="165" x2="595" y2="165" stroke="#e0e0e0" stroke-width="0.5"/>
  <text x="370" y="183" font-size="10" fill="#444" font-family="monospace">cis_engine.py</text>
  <text x="370" y="200" font-size="10" fill="#444" font-family="monospace">rules.json</text>
  <text x="370" y="217" font-size="10" fill="#444" font-family="monospace">guidance.json</text>
  <text x="370" y="234" font-size="10" fill="#444" font-family="monospace">sections.json</text>

  <!-- Arrow files → run -->
  <line x1="480" y1="260" x2="480" y2="278" stroke="#999" stroke-width="1"/>

  <!-- ===== Step 3: run engine ===== -->
  <rect x="350" y="280" width="260" height="100" rx="2" fill="#fff" stroke="#b0d4b0" stroke-width="1"/>
  <rect x="350" y="280" width="28" height="100" rx="2" fill="#e67e22"/>
  <text x="364" y="296" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">3</text>
  <text x="388" y="296" font-size="11" font-weight="700" fill="#2c3e50">run engine</text>
  <text x="388" y="314" font-size="9" fill="#666">python3 cis_engine.py --mode scan|apply</text>

  <!-- scan / apply badges -->
  <rect x="388" y="324" width="98" height="22" rx="2" fill="#e8f4fd"/>
  <text x="437" y="339" text-anchor="middle" font-size="9" fill="#2563eb">scan: read-only check</text>
  <rect x="492" y="324" width="98" height="22" rx="2" fill="#e8f4fd"/>
  <text x="541" y="339" text-anchor="middle" font-size="9" fill="#2563eb">apply: patch + re-verify</text>

  <text x="480" y="368" text-anchor="middle" font-size="8" fill="#999">apply writes backup to /var/backups/cis-*</text>

  <!-- Arrow run → result.json -->
  <line x1="480" y1="380" x2="480" y2="400" stroke="#999" stroke-width="1"/>

  <!-- ===== result.json ===== -->
  <rect x="390" y="402" width="180" height="26" rx="2" fill="#fffbe6" stroke="#f0d040" stroke-width="1"/>
  <text x="480" y="419" text-anchor="middle" font-size="10" font-weight="600" fill="#8b6914" font-family="monospace">result.json</text>

  <!-- Arrow result.json → fetch (leftward) -->
  <line x1="344" y1="415" x2="298" y2="415" stroke="#999" stroke-width="1.5"/>

  <!-- ===== Step 4: fetch ===== -->
  <rect x="30" y="396" width="260" height="54" rx="2" fill="#fff" stroke="#b0c4de" stroke-width="1"/>
  <rect x="30" y="396" width="28" height="54" rx="2" fill="#e67e22"/>
  <text x="44" y="412" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">4</text>
  <text x="68" y="412" font-size="11" font-weight="700" fill="#2c3e50">fetch result.json</text>
  <text x="68" y="430" font-size="9" fill="#666">pull scan results back to controller</text>
  <text x="68" y="444" font-size="9" fill="#999">ansible fetch</text>

  <!-- Arrow 4→5 -->
  <line x1="160" y1="450" x2="160" y2="468" stroke="#999" stroke-width="1"/>

  <!-- ===== Step 5: render ===== -->
  <rect x="30" y="470" width="260" height="54" rx="2" fill="#fff" stroke="#b0c4de" stroke-width="1"/>
  <rect x="30" y="470" width="28" height="54" rx="2" fill="#9b59b6"/>
  <text x="44" y="486" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">5</text>
  <text x="68" y="486" font-size="11" font-weight="700" fill="#2c3e50">render Jinja2</text>
  <text x="68" y="504" font-size="9" fill="#666">report.html.j2 (+ index.html.j2 if N&gt;1)</text>
  <text x="68" y="518" font-size="9" fill="#999">+ findings.csv.j2</text>

  <!-- Arrow 5→6 -->
  <line x1="160" y1="524" x2="160" y2="534" stroke="#999" stroke-width="1"/>

  <!-- ===== Step 6: write ===== -->
  <rect x="30" y="534" width="260" height="24" rx="2" fill="#fff" stroke="#b0c4de" stroke-width="1"/>
  <rect x="30" y="534" width="28" height="24" rx="2" fill="#4a90d9"/>
  <text x="44" y="550" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">6</text>
  <text x="68" y="550" font-size="11" font-weight="700" fill="#2c3e50">write reports to disk</text>

  <!-- Arrow 6 → reports/ (rightward) -->
  <line x1="290" y1="546" x2="658" y2="546" stroke="#999" stroke-width="1.5"/>

  <!-- ===== reports/ on disk ===== -->
  <rect x="670" y="396" width="260" height="170" rx="2" fill="#fff" stroke="#c4b0d4" stroke-width="1"/>
  <text x="800" y="416" text-anchor="middle" font-size="11" font-weight="700" fill="#7c3aed">reports/</text>
  <line x1="685" y1="424" x2="915" y2="424" stroke="#e0e0e0" stroke-width="0.5"/>

  <rect x="685" y="436" width="230" height="24" rx="2" fill="#f8f0ff"/>
  <text x="694" y="452" font-size="9" fill="#6b21a8" font-family="monospace">HOST-L1-scan.html</text>
  <text x="886" y="452" text-anchor="end" font-size="8" fill="#aaa">per-host report</text>

  <rect x="685" y="464" width="230" height="24" rx="2" fill="#f8f0ff"/>
  <text x="694" y="480" font-size="9" fill="#6b21a8" font-family="monospace">HOST-L1-apply.html</text>
  <text x="886" y="480" text-anchor="end" font-size="8" fill="#aaa">post-remediation</text>

  <rect x="685" y="492" width="230" height="24" rx="2" fill="#f8f0ff"/>
  <text x="694" y="508" font-size="9" fill="#6b21a8" font-family="monospace">index.html</text>
  <text x="886" y="508" text-anchor="end" font-size="8" fill="#aaa">fleet view (N&gt;1)</text>

  <rect x="685" y="520" width="230" height="24" rx="2" fill="#f8f0ff"/>
  <text x="694" y="536" font-size="9" fill="#6b21a8" font-family="monospace">*.json, findings.csv</text>
  <text x="886" y="536" text-anchor="end" font-size="8" fill="#aaa">raw data</text>

  <!-- CLI hint at bottom -->
  <text x="480" y="572" text-anchor="middle" font-size="9" fill="#999">ansible-playbook scan.yml | apply.yml -i inventory/hosts.ini</text>
</svg>
