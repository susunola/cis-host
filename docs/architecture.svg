<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-label="SecX Automation Suite Architecture">
  <style><![CDATA[
    .lane-bg { fill: #fafbfc; stroke: #e2e8f0; stroke-width: 1; }
    .lane-label { fill: #64748b; font-size: 9px; font-weight: 600; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    .box-bg { fill: #ffffff; stroke-width: 1.2; }
    .box-blue { stroke: #3b82f6; }
    .box-amber { stroke: #d97706; }
    .box-green { stroke: #16a34a; }
    .box-slate { stroke: #64748b; }
    .box-red { stroke: #dc2626; }

    .box-title { fill: #1e293b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .box-desc  { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .box-tag   { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .tag-blue  { fill: #3b82f6; }
    .tag-amber { fill: #d97706; }
    .tag-green { fill: #16a34a; }
    .tag-slate { fill: #64748b; }

    .arrow { fill: none; stroke: #94a3b8; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .arrow-label { fill: #94a3b8; font-size: 7px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  ]]></style>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="580" fill="#ffffff"/>

  <!-- ===== LANES ===== -->

  <!-- Lane 1: Control Plane -->
  <rect x="20" y="16" width="760" height="100" rx="4" class="lane-bg"/>
  <text x="30" y="30" class="lane-label">Control Plane</text>

  <!-- Lane 2: Transport -->
  <rect x="20" y="128" width="760" height="80" rx="4" class="lane-bg"/>
  <text x="30" y="142" class="lane-label">Transport</text>

  <!-- Lane 3: Execution -->
  <rect x="20" y="220" width="760" height="90" rx="4" class="lane-bg"/>
  <text x="30" y="234" class="lane-label">Execution</text>

  <!-- Lane 4: Audit &amp; Reporting -->
  <rect x="20" y="322" width="760" height="120" rx="4" class="lane-bg"/>
  <text x="30" y="336" class="lane-label">Audit &amp; Reporting</text>

  <!-- Lane 5: Output -->
  <rect x="20" y="454" width="760" height="106" rx="4" class="lane-bg"/>
  <text x="30" y="468" class="lane-label">Output</text>

  <!-- ===== ARROWS ===== -->

  <!-- Operator → Control Machine -->
  <line x1="176" y1="66" x2="210" y2="66" class="arrow" marker-end="url(#a)"/>

  <!-- Control Machine → Inventory -->
  <line x1="484" y1="66" x2="516" y2="66" class="arrow" marker-end="url(#a)"/>

  <!-- Control Machine → Transport -->
  <path d="M 360 96 L 360 156" class="arrow" marker-end="url(#a)"/>
  <text x="366" y="132" class="arrow-label">deploy</text>

  <!-- Transport → Linux Engine -->
  <path d="M 280 188 L 230 188 Q 220 188 220 198 L 220 248" class="arrow" marker-end="url(#a)"/>
  <text x="240" y="224" class="arrow-label">SSH</text>

  <!-- Transport → Windows Engine -->
  <path d="M 520 188 L 570 188 Q 580 188 580 198 L 580 248" class="arrow" marker-end="url(#a)"/>
  <text x="532" y="224" class="arrow-label">WinRM</text>

  <!-- Linux Engine → result.json -->
  <path d="M 220 300 L 220 350" class="arrow" marker-end="url(#a)"/>

  <!-- Linux Engine → audit.log -->
  <path d="M 220 300 L 220 324 Q 220 334 230 334 L 510 334 Q 520 334 520 324 L 520 350" class="arrow" marker-end="url(#a)"/>

  <!-- Windows Engine → audit.log -->
  <path d="M 580 300 L 580 350" class="arrow" marker-end="url(#a)"/>

  <!-- Windows Engine → result.json -->
  <path d="M 580 300 L 580 324 Q 580 334 570 334 L 290 334 Q 280 334 280 324 L 280 350" class="arrow" marker-end="url(#a)"/>

  <!-- result.json → Report Engine -->
  <path d="M 320 398 L 320 432" class="arrow" marker-end="url(#a)"/>

  <!-- audit.log → Report Engine -->
  <path d="M 480 398 L 480 432" class="arrow" marker-end="url(#a)"/>

  <!-- Report Engine → Outputs -->
  <path d="M 280 486 L 200 486 Q 190 486 190 496 L 190 516" class="arrow" marker-end="url(#a)"/>
  <path d="M 400 486 L 400 516" class="arrow" marker-end="url(#a)"/>
  <path d="M 520 486 L 600 486 Q 610 486 610 496 L 610 516" class="arrow" marker-end="url(#a)"/>

  <text x="376" y="502" class="arrow-label">render</text>

  <!-- ===== BOXES ===== -->

  <!-- Row 1: Operator, Control Machine, Inventory -->
  <rect x="56" y="40" width="120" height="52" rx="3" class="box-bg box-slate"/>
  <text x="116" y="61" class="box-title" font-size="12" font-weight="600" text-anchor="middle">Operator</text>
  <text x="116" y="79" class="box-desc" font-size="9" text-anchor="middle">Security / DevOps</text>

  <rect x="210" y="40" width="274" height="52" rx="3" class="box-bg box-blue"/>
  <text x="347" y="61" class="box-title" font-size="12" font-weight="600" text-anchor="middle">Control Machine</text>
  <text x="347" y="79" class="box-desc" font-size="9" text-anchor="middle">cis_cli.py · ansible-playbook · Inventory · Schedule</text>

  <rect x="516" y="40" width="110" height="52" rx="3" class="box-bg box-slate"/>
  <text x="571" y="61" class="box-title" font-size="12" font-weight="600" text-anchor="middle">Inventory</text>
  <text x="571" y="79" class="box-desc" font-size="9" text-anchor="middle">hosts · group_vars</text>

  <!-- Row 2: Ansible Transport -->
  <rect x="190" y="164" width="420" height="48" rx="3" class="box-bg box-amber"/>
  <text x="400" y="185" class="box-title" font-size="12" font-weight="600" text-anchor="middle">Ansible Transport Layer</text>
  <text x="400" y="201" class="box-desc" font-size="9" text-anchor="middle">SSH (Linux) · WinRM (Windows) — push · run · fetch · render</text>

  <!-- Row 3: Engines -->
  <rect x="60" y="256" width="320" height="52" rx="3" class="box-bg box-green"/>
  <text x="220" y="277" class="box-title" font-size="12" font-weight="600" text-anchor="middle">Linux Compliance Engine</text>
  <text x="220" y="295" class="box-desc" font-size="9" text-anchor="middle">6 distributions · RHEL / TencentOS / SLES / Ubuntu · Single-file Python</text>

  <rect x="420" y="256" width="320" height="52" rx="3" class="box-bg box-green"/>
  <text x="580" y="277" class="box-title" font-size="12" font-weight="600" text-anchor="middle">Windows Compliance Engine</text>
  <text x="580" y="295" class="box-desc" font-size="9" text-anchor="middle">Server 2016 / 2019 / 2022 / 2025 · Single-file PowerShell</text>

  <!-- Row 4: Data stores -->
  <rect x="120" y="358" width="200" height="48" rx="3" class="box-bg box-slate"/>
  <text x="220" y="376" class="box-title" font-size="11" font-weight="600" text-anchor="middle">result.json</text>
  <text x="220" y="394" class="box-desc" font-size="9" text-anchor="middle">Structured findings · machine-readable</text>

  <rect x="480" y="358" width="200" height="48" rx="3" class="box-bg box-red"/>
  <text x="580" y="376" class="box-title" font-size="11" font-weight="600" text-anchor="middle">audit.log</text>
  <text x="580" y="394" class="box-desc" font-size="9" text-anchor="middle">JSON-lines append-only · SIEM-ready</text>

  <!-- Row 5: Report Engine -->
  <rect x="190" y="440" width="420" height="48" rx="3" class="box-bg box-blue"/>
  <text x="400" y="461" class="box-title" font-size="12" font-weight="600" text-anchor="middle">Jinja2 Report Engine</text>
  <text x="400" y="477" class="box-desc" font-size="9" text-anchor="middle">Self-contained HTML · Dark / Light theme · EN · 中文 · 日本語 · ไทย</text>

  <!-- Row 6: Outputs -->
  <rect x="40" y="524" width="220" height="48" rx="3" class="box-bg box-blue"/>
  <text x="150" y="545" class="box-title" font-size="11" font-weight="600" text-anchor="middle">Per-Host Report</text>
  <text x="150" y="561" class="box-desc" font-size="9" text-anchor="middle">Score · Findings · Remediation steps</text>

  <rect x="290" y="524" width="220" height="48" rx="3" class="box-bg box-blue"/>
  <text x="400" y="545" class="box-title" font-size="11" font-weight="600" text-anchor="middle">CSV Findings</text>
  <text x="400" y="561" class="box-desc" font-size="9" text-anchor="middle">Excel · Sheets compatible</text>

  <rect x="540" y="524" width="220" height="48" rx="3" class="box-bg box-blue"/>
  <text x="650" y="545" class="box-title" font-size="11" font-weight="600" text-anchor="middle">Fleet Index</text>
  <text x="650" y="561" class="box-desc" font-size="9" text-anchor="middle">Multi-host compliance overview</text>

</svg>
