<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 590" width="100%" role="img">
  <title>CIS-OS architecture</title>
  <desc>End-to-end CIS benchmark scanning and reporting pipeline across 11 OS targets, driven by Ansible or the cis_cli.py wrapper</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .t13 { font-size: 13px; font-weight: 500; }
    .t12 { font-size: 12px; font-weight: 400; }
    .t11 { font-size: 11px; font-weight: 400; }
  </style>

  <rect x="120" y="50" width="440" height="52" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="t13" x="340" y="69" text-anchor="middle" fill="#0C447C">Control Machine</text>
  <text class="t12" x="340" y="88" text-anchor="middle" fill="#378ADD">ansible-playbook  ·  cis_cli.py scan --os rhel9</text>

  <line x1="340" y1="102" x2="340" y2="146" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="120" y="150" width="440" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="t12" x="340" y="168" text-anchor="middle" fill="#444441" font-weight="500">Ansible Transport</text>
  <text class="t11" x="340" y="185" text-anchor="middle" fill="#888780">Push files → Run engine → Fetch result.json</text>

  <polyline points="340,194 180,194 180,236" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="340,194 500,194 500,236" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="240" width="240" height="80" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="t13" x="180" y="260" text-anchor="middle" fill="#3C3489">Linux Hosts</text>
  <text class="t11" x="180" y="279" text-anchor="middle" fill="#534AB7">10 distributions</text>
  <text class="mono" x="180" y="298" text-anchor="middle" fill="#534AB7">cis_engine.py  +  rules.json</text>

  <rect x="380" y="240" width="240" height="80" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="t13" x="500" y="260" text-anchor="middle" fill="#085041">Windows Host</text>
  <text class="t11" x="500" y="279" text-anchor="middle" fill="#0F6E56">Server 2025</text>
  <text class="mono" x="500" y="298" text-anchor="middle" fill="#0F6E56">cis_engine.ps1  +  rules.json</text>

  <rect x="120" y="342" width="120" height="26" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="mono" x="180" y="359" text-anchor="middle" fill="#444441">result.json</text>

  <rect x="440" y="342" width="120" height="26" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text class="mono" x="500" y="359" text-anchor="middle" fill="#444441">result.json</text>

  <polyline points="180,368 180,390 340,390 340,416" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="500,368 500,390 340,390" fill="none" stroke="#888780" stroke-width="1.5"/>

  <rect x="130" y="420" width="420" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="t12" x="340" y="438" text-anchor="middle" fill="#633806" font-weight="500">Jinja2 Template Engine</text>
  <text class="mono" x="340" y="455" text-anchor="middle" fill="#BA7517">report.html.j2  +  guidance.json  +  sections.json</text>

  <line x1="340" y1="464" x2="340" y2="506" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="160" y="510" width="360" height="46" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="t13" x="340" y="530" text-anchor="middle" fill="#3B6D11">Interactive HTML Report</text>
  <text class="t11" x="340" y="547" text-anchor="middle" fill="#639922">Score · Findings table · Filters · Print-ready</text>

  <rect x="527" y="55" width="113" height="22" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="t11" x="583" y="70" text-anchor="middle" fill="#534AB7">TOS3/4 · RHEL8/9/10</text>

  <rect x="527" y="80" width="122" height="22" rx="4" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="t11" x="588" y="95" text-anchor="middle" fill="#534AB7">SLES15/16 · Ubuntu LTS</text>

  <line x1="527" y1="66" x2="510" y2="66" stroke="#AFA9EC" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="510" y1="66" x2="510" y2="91" stroke="#AFA9EC" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="510" y1="91" x2="527" y2="91" stroke="#AFA9EC" stroke-width="0.5" stroke-dasharray="3,3"/>
</svg>
