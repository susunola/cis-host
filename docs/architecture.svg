<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330">
  <style><![CDATA[
    .bg  { fill: #ffffff; }
    .sep { stroke: #e8ecf0; stroke-width: 1; }
    .box { fill: #ffffff; stroke-width: 1.2; rx: 3; }
    .c-cmd  { stroke: #5b6e8a; }
    .c-py   { stroke: #2563eb; }
    .c-json { stroke: #7c3aed; }
    .c-j2   { stroke: #d97706; }
    .c-html { stroke: #16a34a; }
    .c-csv  { stroke: #0891b2; }
    .c-log  { stroke: #dc2626; }
    .c-file { stroke: #94a3b8; }

    .t-mb  { fill: #111827; font-family: 'SF Mono','Menlo','Consolas',monospace; font-weight: 700; }
    .t-m   { fill: #475569; font-family: 'SF Mono','Menlo','Consolas',monospace; }
    .t-d   { fill: #64748b; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .t-h   { fill: #0f172a; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-weight: 600; }
    .t-sec { fill: #94a3b8; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; }

    .badge { font-size: 8px; font-weight: 600; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
    .arr   { fill: none; stroke: #94a3b8; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
    .arr-l { fill: #94a3b8; font-size: 7px; font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
  ]]></style>

  <defs>
    <marker id="a" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto"><polygon points="0 0, 7 2.5, 0 5" fill="#94a3b8"/></marker>
  </defs>

  <rect width="960" height="330" class="bg"/>

  <!-- Column separators (subtle) -->
  <line x1="190" y1="22" x2="190" y2="312" class="sep"/>
  <line x1="370" y1="22" x2="370" y2="312" class="sep"/>
  <line x1="550" y1="22" x2="550" y2="312" class="sep"/>
  <line x1="740" y1="22" x2="740" y2="312" class="sep"/>

  <!-- Section headers -->
  <text x="56" y="16" text-anchor="middle" class="t-sec">INPUT</text>
  <text x="280" y="16" text-anchor="middle" class="t-sec">ENGINE</text>
  <text x="460" y="16" text-anchor="middle" class="t-sec">DATA</text>
  <text x="645" y="16" text-anchor="middle" class="t-sec">RENDER</text>
  <text x="850" y="16" text-anchor="middle" class="t-sec">OUTPUT</text>

  <!-- ══════════════════════════════════════════  -->
  <!-- COL 1: INPUT                              -->
  <!-- ══════════════════════════════════════════  -->

  <!-- Ansible -->
  <rect x="24" y="32" width="146" height="48" class="box c-cmd"/>
  <text x="36" y="52" class="t-mb" font-size="11">ansible-playbook</text>
  <text x="36" y="68" class="t-m" font-size="9">scan.yml / apply.yml</text>

  <!-- CLI -->
  <rect x="24" y="92" width="146" height="48" class="box c-cmd"/>
  <text x="36" y="112" class="t-mb" font-size="11">ohbs_cli.py</text>
  <text x="36" y="128" class="t-m" font-size="9">scan / apply / info / check</text>

  <!-- Separator "or" between them -->
  <text x="97" y="85" text-anchor="middle" class="t-d" font-size="9">or</text>

  <!-- Arrow INPUT → ENGINE (under ansible/CLI block, going right) -->
  <path d="M 170 60 L 200 60" class="arr" marker-end="url(#a)"/>
  <path d="M 170 116 L 200 116" class="arr" marker-end="url(#a)"/>
  <text x="185" y="52" text-anchor="middle" class="arr-l">via ssh</text>

  <!-- ══════════════════════════════════════════  -->
  <!-- COL 2: ENGINE                             -->
  <!-- ══════════════════════════════════════════  -->

  <rect x="200" y="32" width="154" height="108" class="box c-py"/>

  <!-- Badge -->
  <rect x="206" y="27" width="58" height="14" rx="2" fill="#dbeafe" stroke="#bfdbfe" stroke-width="0.7"/>
  <text x="235" y="38" text-anchor="middle" class="badge" fill="#2563eb">Python 3</text>

  <text x="212" y="58" class="t-mb" font-size="11">ohbs_engine.py</text>
  <text x="212" y="74" class="t-d" font-size="9">Single-file engine</text>
  <text x="212" y="90" class="t-m" font-size="8">--catalog rules.json</text>
  <text x="212" y="104" class="t-m" font-size="8">--mode scan | apply</text>
  <text x="212" y="120" class="t-m" font-size="8">--profile L1 | L2</text>
  <text x="212" y="134" class="t-d" font-size="8">Zero deps · stdlib only</text>

  <!-- Arrow ENGINE → DATA (clean horizontal) -->
  <path d="M 354 56 L 384 56" class="arr" marker-end="url(#a)"/>
  <path d="M 354 116 L 384 116" class="arr" marker-end="url(#a)"/>

  <!-- ══════════════════════════════════════════  -->
  <!-- COL 3: DATA                               -->
  <!-- ══════════════════════════════════════════  -->

  <!-- result.json -->
  <rect x="384" y="32" width="150" height="48" class="box c-json"/>
  <rect x="390" y="27" width="40" height="14" rx="2" fill="#ede9fe" stroke="#ddd6fe" stroke-width="0.7"/>
  <text x="410" y="38" text-anchor="middle" class="badge" fill="#7c3aed">JSON</text>

  <text x="396" y="54" class="t-mb" font-size="11">result.json</text>
  <text x="396" y="70" class="t-m" font-size="9">pass · fail · manual · N/A</text>

  <!-- audit.log -->
  <rect x="384" y="92" width="150" height="48" class="box c-log"/>
  <rect x="390" y="87" width="36" height="14" rx="2" fill="#fee2e2" stroke="#fecaca" stroke-width="0.7"/>
  <text x="408" y="98" text-anchor="middle" class="badge" fill="#dc2626">log</text>

  <text x="396" y="114" class="t-mb" font-size="11">audit.log</text>
  <text x="396" y="130" class="t-m" font-size="9">JSON-lines · SIEM</text>

  <!-- Arrows DATA → RENDER (clean horizontal) -->
  <path d="M 534 56 L 564 56" class="arr" marker-end="url(#a)"/>
  <path d="M 534 116 L 564 116" class="arr" marker-end="url(#a)"/>

  <!-- ══════════════════════════════════════════  -->
  <!-- COL 4: RENDER                             -->
  <!-- ══════════════════════════════════════════  -->

  <!-- Static data -->
  <rect x="564" y="32" width="160" height="48" class="box c-file"/>
  <text x="576" y="50" class="t-mb" font-size="10">guidance.json</text>
  <text x="576" y="64" class="t-m" font-size="9">remediation · rationale</text>
  <text x="576" y="76" class="t-m" font-size="9">sections.json · chapters</text>

  <!-- Jinja2 Templates -->
  <rect x="564" y="92" width="160" height="48" class="box c-j2"/>
  <rect x="570" y="87" width="44" height="14" rx="2" fill="#fef3c7" stroke="#fde68a" stroke-width="0.7"/>
  <text x="592" y="98" text-anchor="middle" class="badge" fill="#d97706">Jinja2</text>

  <text x="576" y="114" class="t-mb" font-size="10">report.html.j2</text>
  <text x="576" y="128" class="t-m" font-size="9">index.html.j2 · .csv.j2</text>

  <!-- Arrows RENDER → OUTPUT -->
  <path d="M 724 56 L 739 56" class="arr" marker-end="url(#a)"/>
  <path d="M 724 116 L 739 116" class="arr" marker-end="url(#a)"/>

  <!-- ══════════════════════════════════════════  -->
  <!-- COL 5: OUTPUT (2 rows × 2 cols)           -->
  <!-- ══════════════════════════════════════════  -->

  <!-- Per-Host HTML -->
  <rect x="752" y="32" width="186" height="48" class="box c-html"/>
  <rect x="758" y="27" width="44" height="14" rx="2" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.7"/>
  <text x="780" y="38" text-anchor="middle" class="badge" fill="#16a34a">HTML</text>

  <text x="764" y="54" class="t-mb" font-size="10">Per-Host Report</text>
  <text x="764" y="70" class="t-m" font-size="9">score · findings · steps</text>

  <!-- Fleet Index -->
  <rect x="752" y="92" width="186" height="48" class="box c-html"/>
  <rect x="758" y="87" width="44" height="14" rx="2" fill="#dcfce7" stroke="#bbf7d0" stroke-width="0.7"/>
  <text x="780" y="98" text-anchor="middle" class="badge" fill="#16a34a">HTML</text>

  <text x="764" y="114" class="t-mb" font-size="10">Fleet Index</text>
  <text x="764" y="130" class="t-m" font-size="9">multi-host overview</text>

  <!-- Bottom row outputs -->
  <!-- Per-Host JSON copy -->
  <rect x="752" y="160" width="96" height="48" class="box c-json"/>
  <text x="764" y="180" class="t-mb" font-size="10">JSON copy</text>
  <text x="764" y="196" class="t-m" font-size="9">per host</text>

  <!-- CSV -->
  <rect x="860" y="160" width="78" height="48" class="box c-csv"/>
  <text x="872" y="180" class="t-mb" font-size="10">CSV</text>
  <text x="872" y="196" class="t-m" font-size="9">findings</text>

  <!-- ══════════════════════════════════════════  -->
  <!-- BOTTOM: engine notes                      -->
  <!-- ══════════════════════════════════════════  -->

  <line x1="20" y1="230" x2="940" y2="230" stroke="#f1f5f9" stroke-width="1"/>

  <rect x="20" y="246" width="170" height="60" class="box c-file"/>
  <text x="32" y="264" class="t-mb" font-size="10">rules.json</text>
  <text x="32" y="280" class="t-m" font-size="9">14 OS catalogs</text>
  <text x="32" y="296" class="t-d" font-size="8">Linux · win — read by engine</text>

  <rect x="210" y="246" width="300" height="60" class="box c-file"/>
  <text x="222" y="266" class="t-h" font-size="11">Supported OS: 14 targets across 2 platforms</text>
  <text x="222" y="282" class="t-m" font-size="9">Linux: RHEL 8/9/10 · TencentOS 3/4 · SLES 15/16 · Ubuntu 20.04 / 22.04 / 24.04</text>
  <text x="222" y="298" class="t-m" font-size="9">Windows: Server 2016 / 2019 / 2022 / 2025</text>

  <rect x="530" y="246" width="200" height="60" class="box c-file"/>
  <text x="542" y="266" class="t-h" font-size="11">Output writes to:</text>
  <text x="542" y="282" class="t-m" font-size="9">playbook_dir/reports/</text>
  <text x="542" y="298" class="t-m" font-size="9">--output ./out/ via ohbs_cli.py</text>

  <rect x="750" y="246" width="190" height="60" class="box c-file"/>
  <text x="762" y="266" class="t-h" font-size="11">CI / Cron ready</text>
  <text x="762" y="282" class="t-m" font-size="9">JSON stdout for pipelines</text>
  <text x="762" y="298" class="t-m" font-size="9">non-zero exit on findings</text>

  <!-- Arrow rules.json → engine (up, to engine bottom) -->
  <path d="M 105 246 L 105 150" class="arr" marker-end="url(#a)"/>
  <text x="78" y="200" text-anchor="end" class="arr-l">read</text>

</svg>
