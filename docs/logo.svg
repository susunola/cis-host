<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="arc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006EFF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.68" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#006EFF" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#006EFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#006EFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark background -->
  <rect width="200" height="200" rx="32" fill="#0D1117"/>

  <!-- Background glow -->
  <rect width="200" height="200" rx="32" fill="url(#glow)"/>

  <!-- Arc 1 (top) — outermost, most transparent -->
  <path d="M40,52 Q95,24 152,100"
        fill="none" stroke="url(#arc-grad)" stroke-width="4.5" stroke-linecap="round"
        stroke-opacity="0.28"/>

  <!-- Arc 2 (middle) -->
  <path d="M32,100 Q95,36 152,100"
        fill="none" stroke="url(#arc-grad)" stroke-width="4.5" stroke-linecap="round"
        stroke-opacity="0.55"/>

  <!-- Arc 3 (bottom) — innermost, most opaque -->
  <path d="M40,148 Q95,48 152,100"
        fill="none" stroke="url(#arc-grad)" stroke-width="5" stroke-linecap="round"
        stroke-opacity="0.88"/>

  <!-- Source nodes (left side) -->
  <circle cx="40" cy="52" r="5.5" fill="#006EFF" fill-opacity="0.3"/>
  <circle cx="32" cy="100" r="5.5" fill="#006EFF" fill-opacity="0.55"/>
  <circle cx="40" cy="148" r="5.5" fill="#006EFF" fill-opacity="0.85"/>

  <!-- Target node (right side, glow) -->
  <circle cx="152" cy="100" r="14" fill="#006EFF" fill-opacity="0.12"/>
  <circle cx="152" cy="100" r="8" fill="url(#arc-grad)" fill-opacity="0.25"/>
  <circle cx="152" cy="100" r="5.5" fill="url(#arc-grad)"/>

  <!-- Checkmark -->
  <path d="M142,100 L148.5,107 L162,92"
        fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inner dot glow -->
  <circle cx="152" cy="100" r="24" fill="#00B4D8" fill-opacity="0.06"/>
</svg>
