<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="arc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#006EFF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>

  <!-- Arc 1 (top) — outermost, most transparent -->
  <path d="M40,52 Q95,24 152,100"
        fill="none" stroke="url(#arc-grad)" stroke-width="4.5" stroke-linecap="round"
        stroke-opacity="0.35"/>

  <!-- Arc 2 (middle) -->
  <path d="M32,100 Q95,36 152,100"
        fill="none" stroke="url(#arc-grad)" stroke-width="4.5" stroke-linecap="round"
        stroke-opacity="0.6"/>

  <!-- Arc 3 (bottom) — innermost, most opaque -->
  <path d="M40,148 Q95,48 152,100"
        fill="none" stroke="url(#arc-grad)" stroke-width="5" stroke-linecap="round"
        stroke-opacity="0.95"/>

  <!-- Source nodes (left side) -->
  <circle cx="40" cy="52" r="5.5" fill="#006EFF" fill-opacity="0.35"/>
  <circle cx="32" cy="100" r="5.5" fill="#006EFF" fill-opacity="0.6"/>
  <circle cx="40" cy="148" r="5.5" fill="#006EFF" fill-opacity="0.95"/>

  <!-- Target node outer halo -->
  <circle cx="152" cy="100" r="18" fill="#006EFF" fill-opacity="0.08"/>
  <circle cx="152" cy="100" r="12" fill="#006EFF" fill-opacity="0.15"/>

  <!-- Target node (gradient core) -->
  <circle cx="152" cy="100" r="7" fill="url(#arc-grad)"/>

  <!-- Checkmark — dark for visibility on light backgrounds -->
  <path d="M148,100 L151,103 L156,97.5"
        fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
