---
- name: Pre-flight checks
  ansible.builtin.include_tasks: preflight.yml
  tags: [cis, always]

- name: Run CIS benchmark
  ansible.builtin.include_tasks: run.yml
  tags: [cis, scan, apply]

- name: Generate reports
  ansible.builtin.include_tasks: report.yml
  tags: [cis, report]

- name: Gate on findings
  ansible.builtin.include_tasks: gate.yml
  when: cis_fail_on_findings | default(false) or (cis_min_score | default(0) | int) > 0
