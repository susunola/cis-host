---
# Verify: re-run the CIS engine in scan mode and confirm it returns valid JSON.
# Containerized platforms may not satisfy every rule, so we only assert that
# the engine exits cleanly and no rules report an internal error.
- name: Verify
  hosts: all
  roles:
    - role: cis-ubuntu2404
      vars:
        cis_mode: scan
        cis_skip_reboot: true
  tasks:
    - name: Assert CIS engine produced a valid JSON result
      ansible.builtin.assert:
        that:
          - cis_result is defined
          - cis_result.results is defined
        fail_msg: "CIS engine did not produce a valid JSON result"

    - name: Assert no rules reported an internal error
      ansible.builtin.assert:
        that:
          - cis_result.results.values() | selectattr('status', 'equalto', 'error') | list | length == 0
        fail_msg: "One or more CIS rules reported an internal error"
        success_msg: "CIS engine completed with no internal errors"
      ignore_errors: true
