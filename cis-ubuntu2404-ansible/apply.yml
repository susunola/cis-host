---
# Assess, remediate everything that fails, then re-assess to confirm.
# Remediations that could interrupt service are skipped unless
# cis_allow_disruptive=true is passed explicitly.
#
#   ansible-playbook -i inventory/hosts.ini apply.yml
#   ansible-playbook -i inventory/hosts.ini apply.yml -e cis_profile=L2
#   ansible-playbook -i inventory/hosts.ini apply.yml -e cis_allow_disruptive=true
#
# Always run scan.yml first and read the report before applying to production.
- name: "CIS Ubuntu 24.04 LTS - apply ({{ cis_profile | default('L1') }})"
  hosts: "{{ cis_hosts | default('ubuntu2404') }}"
  gather_facts: true
  become: true
  serial: "{{ cis_serial | default('25%') }}"
  max_fail_percentage: "{{ cis_max_fail_percentage | default(0) }}"


# ---------------------------------------------------------------------------
# SELF-LOCKOUT SAFETY
#
# By default disruptive remediations (e.g. PermitRootLogin no, firewall
# changes that require a reboot) are SKIPPED.  If you pass
# -e cis_allow_disruptive=true while logged in as root, you CAN lock yourself
# out of the host.  Always ensure out-of-band/console access before enabling
# disruptive remediations, and run scan.yml first to review the findings.
# ---------------------------------------------------------------------------

  pre_tasks:
    - name: Confirm the operator understands apply mode
      ansible.builtin.debug:
        msg: >-
          APPLY on {{ inventory_hostname }} - profile {{ cis_profile | default('L1') }},
          disruptive remediations
          {{ 'ENABLED' if cis_allow_disruptive | default(false) | bool else 'disabled' }}.
          Modified files are backed up under
          {{ cis_backup_dir | default('/var/backups/cis-ubuntu2404') }}.

  roles:
    - role: cis_ubuntu2404
      vars:
        cis_mode: apply
