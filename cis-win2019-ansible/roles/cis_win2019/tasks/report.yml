---
# Windows CIS report generation (runs on controller, not target)
- name: Set report slug for fleet index linking
  ansible.builtin.set_fact:
    cis_report_slug: "{{ inventory_hostname }}/report"
  when: cis_report_index | bool

- name: Generate per-host HTML report
  ansible.builtin.template:
    src: report.html.j2
    dest: "{{ cis_report_dir }}/{{ inventory_hostname }}/report.html"
  delegate_to: localhost
  when: cis_report_html | bool

- name: Generate per-host CSV findings
  ansible.builtin.template:
    src: findings.csv.j2
    dest: "{{ cis_report_dir }}/{{ inventory_hostname }}/findings.csv"
  delegate_to: localhost
  when: cis_report_csv | bool

- name: Generate fleet index
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ cis_report_dir }}/index.html"
  delegate_to: localhost
  when:
    - cis_report_index | bool
    - cis_fleet_size | int > 0
