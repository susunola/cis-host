# ---------------------------------------------------------------------------
# Inventory for the CIS Microsoft Windows Server 2019 Benchmark playbooks.
# Replace the samples below with your own hosts.
# Requires WinRM connectivity: configure HTTPS listener on the target first.
# ---------------------------------------------------------------------------

[win2019]
# win2019-web-01  ansible_host=10.0.1.11
# win2019-web-02  ansible_host=10.0.1.12
# win2019-db-01   ansible_host=10.0.2.21  cis_profile=L2

[win2019:vars]
ansible_connection      = winrm
ansible_winrm_transport = kerberos
ansible_winrm_port      = 5986
ansible_winrm_server_cert_validation = ignore
; ansible_user           = Administrator
; ansible_password       = "{{ vault_winrm_password }}"
; ansible_become_method  = runas
; ansible_become_user    = SYSTEM
