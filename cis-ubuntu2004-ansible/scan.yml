---
# Read-only assessment. Nothing on the target is modified.
#   ansible-playbook -i inventory/hosts.ini scan.yml
#   ansible-playbook -i inventory/hosts.ini scan.yml -e cis_profile=L2
- name: "CIS Ubuntu 20.04 LTS - scan ({{ cis_profile | default('L1') }})"
  hosts: "{{ cis_hosts | default('ubuntu2004') }}"
  gather_facts: true
  become: true
  serial: "{{ cis_serial | default('100%') }}"

  roles:
    - role: cis_ubuntu2004
      vars:
        cis_mode: scan
