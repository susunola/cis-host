[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ohbs-host"
version = "1.3.0"
description = "CIS benchmark scan/apply engine and CLI for Linux & Windows server images"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "susunola"},
]
keywords = ["cis", "benchmark", "hardening", "security", "compliance", "ansible"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "Jinja2>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
    "ansible-core>=2.12",
    "tomli>=2.0; python_version<'3.11'",
]
pdf = [
    "weasyprint>=53.0",
]

[project.scripts]
ohbs-host = "ohbs_cli:main"

[project.urls]
Homepage = "https://github.com/susunola/ohbs-host"
Repository = "https://github.com/susunola/ohbs-host"
Issues = "https://github.com/susunola/ohbs-host/issues"

# NOTE: This project is only supported via `pip install -e .` from a source
# checkout. The 14 cis-<os>-ansible/ directories (engine scripts, rules.json,
# guidance/sections JSON, Jinja2 report templates) plus the top-level
# templates/ directory (fleet_report.html.j2, rule_info.html.j2) are
# consumed via paths relative to ohbs_cli.py/fleet.py/info.py at runtime
# and are NOT included in built wheels/sdists. A `pip install ohbs-host`
# from a real package index would install the CLI but
# scan/apply/fleet/info --format html would fail with "Template not
# found" / missing catalog errors. Do not publish this package to PyPI
# until these directories are packaged as included data (package_data)
# and the runtime path resolution is updated to look inside the installed
# package.
[tool.setuptools]
py-modules = ["ohbs_cli", "ohbs_host_config", "ohbs_host_diff", "presets", "catalog", "engine", "display", "report", "fleet", "info", "commands_scan", "commands_watch", "notify", "defaults", "args", "dispatch"]
