---
# --check never modifies the target: apply degrades to a scan.
- name: Determine the effective mode
  ansible.builtin.set_fact:
    cis_mode_effective: "{{ 'scan' if ansible_check_mode and cis_mode == 'apply' else cis_mode }}"

- name: Create a temporary working directory on the target
  ansible.builtin.tempfile:
    state: directory
    prefix: "cis-{{ cis_os_key }}-"
    path: "{{ cis_remote_tmp }}"
  register: cis_workdir
  changed_when: false
  check_mode: false

- name: Verify engine artifacts exist on the controller
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ item }}"
  loop:
    - "{{ ohbs_engine_file }}"
    - "{{ cis_rules_file }}"
    - "{{ cis_guidance_file }}"
    - "{{ cis_sections_file }}"
  register: _artifact_stat
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Fail if any engine artifact is missing
  ansible.builtin.fail:
    msg: "Missing CIS artifact: {{ item.item }}"
  loop: "{{ _artifact_stat.results }}"
  when: not item.stat.exists
  changed_when: false

- name: Validate rules JSON is parseable on the controller
  ansible.builtin.set_fact:
    _rules_json_count: "{{ lookup('file', role_path ~ '/files/' ~ cis_rules_file) | from_json | length }}"
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false
  run_once: true

- name: Ship the assessment engine and rule catalogue
  ansible.builtin.copy:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "{{ cis_workdir.path }}/{{ item }}"
    mode: "0700"
  loop:
    - "{{ ohbs_engine_file }}"
    - "{{ cis_rules_file }}"
  changed_when: false
  check_mode: false

- name: Create the remediation backup directory
  ansible.builtin.file:
    path: "{{ cis_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when:
    - cis_mode_effective == 'apply'
    - not ansible_check_mode
  check_mode: false

- name: Assemble the engine command line
  ansible.builtin.set_fact:
    ohbs_engine_argv: >-
      {{ [cis_python_real,
          cis_workdir.path ~ '/' ~ ohbs_engine_file,
          '--catalog', cis_workdir.path ~ '/' ~ cis_rules_file,
          '--mode', cis_mode_effective,
          '--profile', cis_profile,
          '--platform', cis_platform,
          '--backup-dir', cis_backup_dir,
          '--benchmark', cis_benchmark_name ~ ' ' ~ cis_benchmark_version,
          '--out', cis_workdir.path ~ '/result.json']
         + (['--include', cis_include | join(',')]
            if (cis_include | length) > 0 else [])
         + (['--exclude', cis_exclude | join(',')]
            if (cis_exclude | length) > 0 else [])
         + (['--sections', cis_sections | join(',')]
            if (cis_sections | length) > 0 else [])
         + (['--families', cis_families | join(',')]
            if (cis_families | length) > 0 else [])
         + (['--allow-disruptive']
            if (cis_mode_effective == 'apply' and cis_allow_disruptive | bool)
            else []) }}

- name: "Run the benchmark ({{ cis_mode }} / {{ cis_profile }})"
  ansible.builtin.command:
    argv: "{{ ohbs_engine_argv }}"
  register: ohbs_engine_run
  changed_when: cis_mode_effective == 'apply'
  check_mode: false
  timeout: "{{ ohbs_engine_timeout | int }}"
  environment:
    LC_ALL: C
    LANG: C

- name: Ensure the engine produced a result document
  ansible.builtin.stat:
    path: "{{ cis_workdir.path }}/result.json"
  register: _result_stat
  changed_when: false
  check_mode: false

- name: Fail when the engine did not write result.json
  ansible.builtin.fail:
    msg: >-
      The CIS engine completed but result.json is missing.
      stderr: {{ ohbs_engine_run.stderr | default('(none)') }}
  when: not _result_stat.stat.exists

- name: Read the engine result document
  ansible.builtin.slurp:
    src: "{{ cis_workdir.path }}/result.json"
  register: cis_result_raw
  check_mode: false

- name: Register the result as a fact
  ansible.builtin.set_fact:
    cis_result: "{{ cis_result_raw.content | b64decode | from_json }}"

- name: Remove the temporary working directory
  ansible.builtin.file:
    path: "{{ cis_workdir.path }}"
    state: absent
  when: not (cis_keep_remote_artifacts | bool)
  changed_when: false
  check_mode: false

- name: Record remediation activity
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ cis_result.summary.all.applied | default(0) }} remediated,
      {{ cis_result.summary.all.applied_pending | default(0) }} pending reboot/restart,
      {{ cis_result.summary.all.apply_failed | default(0) }} failed,
      {{ cis_result.summary.all.skipped_disruptive | default(0) }} skipped as disruptive,
      {{ cis_result.changed_files | length }} file(s) rewritten.
  when: cis_mode_effective == 'apply'
  changed_when: >-
    (cis_result.summary.all.applied | default(0) | int)
    + (cis_result.summary.all.applied_pending | default(0) | int) > 0
