---
# CIS Windows Server remediation + re-assessment
- name: "CIS Windows Server Benchmark - apply ({{ cis_profile | default('L1') }})"
  hosts: "{{ cis_hosts | default('win2016') }}"
  gather_facts: true
  serial: "{{ cis_serial | default('100%') }}"

  roles:
    - role: cis_win2016
      vars:
        cis_mode: apply
