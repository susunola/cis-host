---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema jinja2 ansible-core tomli

      - name: Compile Python engines
        run: |
          python -m py_compile ohbs_cli.py ohbs_host_config.py
          for engine in cis-*-ansible/roles/cis_*/files/ohbs_engine.py; do
            python -m py_compile "$engine"
          done

      - name: Run pytest
        run: pytest -v --ignore=tests/fixtures

      - name: Rule verification matrix (release gate)
        run: |
          # M0-M5: scan -> apply -> re-scan closed-loop + idempotency
          # regression matrix, across all 14 OS engines (10 Linux via
          # in-process FakeSystem, 4 Windows via pwsh + FakeWindowsSystem).
          # Kept as its own step (rather than folded into the "Run
          # pytest" step above) so this specific gate's pass/fail is
          # visible on its own in the Actions UI, and so it gets its
          # own skip-detection below.
          #
          # GitHub's ubuntu-latest runner image ships PowerShell (pwsh)
          # pre-installed; fail loudly here rather than letting the
          # Windows fixture tests silently skip if that ever changes,
          # since a skip would quietly drop this gate's Windows coverage.
          command -v pwsh || { echo "pwsh not found - Windows fixture tests would be skipped"; exit 1; }
          pytest tests/fixtures/ -v \
            --junitxml=/tmp/fixture-matrix-junit.xml
          # Defense in depth: even with pwsh confirmed present above,
          # explicitly fail the build if any fixture test still got
          # skipped for any other reason, instead of trusting a green
          # exit code that might be hiding silently-skipped coverage.
          python -c "
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/fixture-matrix-junit.xml').getroot()
          skipped = int(root.get('skipped', 0))
          if skipped:
              raise SystemExit('%d fixture test(s) were skipped - release gate requires full coverage' % skipped)
          print('Rule verification matrix: 0 skipped, all fixture tests ran')
          "

      - name: Validate JSON catalogs
        run: python scripts/validate_json.py

      - name: Ansible syntax check
        run: |
          for pb in cis-*-ansible/scan.yml cis-*-ansible/apply.yml; do
            ansible-playbook --syntax-check "$pb"
          done

      # L4 real-host e2e (docs/TESTING.md §10): boot a real Ubuntu 22.04
      # systemd container, install ohbs-host, and run a real scan -> apply
      # -> re-scan -> idempotent-apply cycle. This is slow and uses Docker,
      # so it runs non-blocking (continue-on-error) for now; it is promoted
      # to a blocking release gate in phase 2 once stable on CI.
      - name: Real-host e2e (L4, non-blocking)
        continue-on-error: true
        run: |
          docker info >/dev/null 2>&1 || { echo "Docker daemon not available - skipping e2e"; exit 0; }
          python3 scripts/real_e2e_test.py --os ubuntu2204 --profile L1 \
            --allow-disruptive -y 2>&1 || { echo "L4 e2e reported a failure (see above)"; exit 1; }

      - name: Test pip install and ohbs-host CLI
        run: |
          pip install -e .
          ohbs-host --help
          ohbs-host list
          ohbs-host scan --help
          ohbs-host apply --help
          printf '[profile]\nos = "rhel9"\nprofile = "L1"\n' > /tmp/ohbs-host.toml
          ohbs-host scan --config /tmp/ohbs-host.toml --help >/dev/null
